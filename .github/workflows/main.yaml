name: main
on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

env:
  REPOSITORY: docker.io/stafftastic/presidio-analyzer

jobs:
  image:
    name: image (${{matrix.system}})
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            architecture: amd64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{matrix.runner}}
    environment: release
    timeout-minutes: 60
    outputs:
      tag: ${{steps.tag.outputs.tag}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Derive the image tag
        id: tag
        run: echo "tag=$(nix eval --raw .#packages.x86_64-linux.presidio-analyzer.version)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build the image and its SBOM
        env:
          SYSTEM: ${{matrix.system}}
        run: |
          nix build -L --out-link image ".#packages.$SYSTEM.presidio-analyzer-image"
          nix build -L --out-link sbom ".#packages.$SYSTEM.presidio-analyzer-image-sbom"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: stafftasticpush
          password: ${{secrets.DOCKER_HUB_TOKEN}}
      - name: Push the image
        env:
          TAG: ${{steps.tag.outputs.tag}}-${{matrix.architecture}}
        run: |
          ./image | docker load
          docker image tag stafftastic/presidio-analyzer:latest "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
      - name: Attach the SBOM
        env:
          TAG: ${{steps.tag.outputs.tag}}-${{matrix.architecture}}
        run: |
          nix shell --inputs-from . nixpkgs#oras --command bash --noprofile --norc -eo pipefail -c '
            subject="$REPOSITORY@$(oras resolve "$REPOSITORY:$TAG")"
            cd sbom
            oras attach --artifact-type application/vnd.cyclonedx+json "$subject" sbom.cdx.json:application/vnd.cyclonedx+json
            oras attach --artifact-type application/spdx+json "$subject" sbom.spdx.json:application/spdx+json
          '

  manifest:
    name: manifest
    needs: image
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: stafftasticpush
          password: ${{secrets.DOCKER_HUB_TOKEN}}
      - name: Push the multi-platform tag
        env:
          TAG: ${{needs.image.outputs.tag}}
        run: docker buildx imagetools create --tag "$REPOSITORY:$TAG" "$REPOSITORY:$TAG-amd64" "$REPOSITORY:$TAG-arm64"
