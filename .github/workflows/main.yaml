name: main
on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - uses: docker/setup-docker-action@v4.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-qemu-action@v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3.12.0
        with:
          driver: docker
      - uses: docker/login-action@v3.7.0
        with:
          username: stafftasticpush
          password: ${{secrets.DOCKER_HUB_TOKEN}}
      - run: nix run .#docker-build -- --platform linux/amd64,linux/arm64 --push
