name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: hetzner-incus
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Mic92/niks3-action@v1.1.0
        with:
          server-url: https://nix-cache.stafftastic.dev
      - run: nix build
      - run: nix run . -- --platform linux/amd64
