name: Pull Request

on:
  pull_request: {}

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number}}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the lint flake checks
        run: nix build -L --keep-going .#checks.x86_64-linux.actionlint .#checks.x86_64-linux.action-pins .#checks.x86_64-linux.ci-coverage .#checks.x86_64-linux.nix-lint .#checks.x86_64-linux.uv-lock

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the format flake checks
        run: nix build -L --keep-going .#checks.x86_64-linux.formatting

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate the flake for every system
        run: nix flake check --no-build --all-systems

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Serve the analyzer, query it and inspect the image
        run: nix build -L --keep-going .#checks.x86_64-linux.smoke .#checks.x86_64-linux.image

  build:
    name: build (${{matrix.system}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the image and its SBOM
        env:
          SYSTEM: ${{matrix.system}}
        run: |
          nix build -L --keep-going --out-link image ".#packages.$SYSTEM.presidio-analyzer-image"
          nix build -L --keep-going --out-link sbom ".#packages.$SYSTEM.presidio-analyzer-image-sbom"
          jq -e '.components | length > 0' sbom/sbom.cdx.json
          jq -e '.packages | length > 0' sbom/sbom.spdx.json
      - name: Load the image and query its health endpoint
        run: |
          ./image | docker load
          docker run -d --name presidio-analyzer -p 3000:3000 stafftastic/presidio-analyzer:latest
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' presidio-analyzer)" != true ]; then
              docker logs presidio-analyzer
              exit 1
            fi
            sleep 1
          done
          docker logs presidio-analyzer
          exit 1
